<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Calma y Orden — Edición Digital Interactiva</title>
<!-- Formato KDP: páginas de 6 x 9 pulgadas. Al imprimir: márgenes = Ninguno, activar "Gráficos de fondo". -->
<style>
  :root{
    --ink:#3b3a52; --paper:#ffffff; --cream:#f2f2f2;
    --accent:#6463aa; --sage:#8f8dc7; --soft:#ccc9e6; --line:#ccc9e6;
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  body{font-family:'Urbanist','Segoe UI',sans-serif;color:var(--ink);background:#ececf1;padding:24px 0;}
  #journal{display:flex;flex-direction:column;align-items:center;gap:24px;}
  .page{width:6in;height:9in;background:var(--paper);padding:.55in .55in .45in;
        box-shadow:0 3px 14px rgba(60,50,35,.18);position:relative;display:flex;flex-direction:column;overflow:hidden;}
  .pgfoot{position:absolute;bottom:.24in;left:0;right:0;text-align:center;font-size:8px;
          letter-spacing:.14em;color:#9a98bd;text-transform:uppercase;}
  .pagenum{position:absolute;left:50%;transform:translateX(-50%);bottom:87px;width:28px;height:28px;
           border-radius:50%;background:#6463aa;color:#fff;font-size:11px;font-weight:bold;
           display:flex;align-items:center;justify-content:center;box-shadow:0 0 0 1px #ccc9e6;}
  @media print{
    body{background:#fff;padding:0;}
    #journal{display:block;gap:0;}
    .page{box-shadow:none;width:6in;height:9in;page-break-after:always;break-after:page;}
    .page:last-child{page-break-after:auto;}
    #toolbar{display:none;}
    .tick.on{-webkit-print-color-adjust:exact;print-color-adjust:exact;}
  }
  @page{size:6in 9in;margin:0;}
  #toolbar{position:fixed;top:14px;right:14px;z-index:99;display:flex;gap:8px;align-items:center;}
  .toolbtn{background:#fff;color:var(--accent);border:1.5px solid var(--soft);padding:9px 16px;border-radius:22px;font-family:inherit;font-size:13px;cursor:pointer;text-decoration:none;}
  .toolbtn:hover{background:var(--cream);}
  #printBtn{background:var(--sage);color:#fff;border:none;padding:10px 18px;border-radius:22px;font-family:inherit;font-size:13px;cursor:pointer;}

  /* ===== Edición interactiva ===== */
  .wline{display:block;width:100%;border:none;border-bottom:1px solid var(--line);height:26px;background:transparent;outline:none;font-family:inherit;font-size:12px;color:var(--ink);padding:0 2px;}
  .wline:focus{border-bottom-color:var(--accent);}
  .inline{flex:1;min-width:0;border:none;background:transparent;outline:none;font-family:inherit;font-size:12px;color:var(--ink);padding:0 2px;}
  .tin{width:100%;height:100%;border:none;background:transparent;outline:none;font-family:inherit;font-size:10px;color:var(--ink);padding:0;}
  .tick{cursor:pointer;}
  .cb.tick.on{background:var(--accent);border-color:var(--accent);}
  .mood-dot.tick.on{background:var(--accent);border-color:var(--accent);}
  td.tick.on{background:#e4e0f4;}
  .monthnav{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:14px;}
  .monthnav a{border:1px solid var(--soft);border-radius:8px;padding:8px;text-align:center;font-size:12px;color:var(--accent);text-decoration:none;background:#fff;}
  .monthnav a:hover{background:var(--cream);}
  .pagenav{display:flex;justify-content:space-between;align-items:center;margin-top:18px;font-size:12px;gap:8px;}
  .pagenav a{color:var(--accent);text-decoration:none;border:1px solid var(--soft);border-radius:16px;padding:5px 14px;background:#fff;}
  .pagenav a:hover{background:var(--cream);}
  .noteswrap{position:relative;flex:1;min-height:200px;}
  .notesarea{position:absolute;inset:0;width:100%;height:100%;background:transparent;border:none;outline:none;font-family:inherit;font-size:12px;line-height:16px;color:var(--ink);resize:none;padding:0;}

  .kicker{font-size:10px;letter-spacing:.28em;text-transform:uppercase;color:var(--accent);margin-bottom:12px;}
  .sec{font-family:'Eternalo',Georgia,serif;font-size:26px;font-weight:normal;color:#6463aa;border-bottom:2px dashed var(--soft);
       padding-bottom:7px;margin-bottom:13px;}
  .daily-title{font-family:'Urbanist','Segoe UI',sans-serif !important;font-size:19px !important;font-weight:700 !important;}
  .sub{font-size:13.5px;color:var(--sage);margin:13px 0 7px;font-weight:700;}
  .body{font-size:11.5px;line-height:1.65;margin-bottom:9px;color:#4a4870;}
  .prompt-q{font-weight:300 !important;}
  .list{list-style:none;}
  .list li{padding-left:16px;position:relative;font-size:11.5px;line-height:1.5;margin-bottom:7px;}
  .list li::before{content:'—';position:absolute;left:0;color:var(--accent);}
  .line{border-bottom:1px solid var(--line);height:26px;}
  .lbl{font-size:9.5px;letter-spacing:.09em;text-transform:uppercase;color:#7876a0;margin-bottom:1px;font-weight:700;}
  .box{border:1.5px solid var(--soft);border-radius:8px;background:#f8f8fa;padding:12px 14px;}
  .cb{display:inline-block;width:11px;height:11px;border:1.5px solid var(--accent);border-radius:3px;margin-right:8px;flex:none;}
  .check-line{display:flex;align-items:flex-end;border-bottom:1px solid var(--line);height:29px;padding-bottom:4px;}
  .mood-dot{display:inline-block;width:13px;height:13px;border-radius:50%;border:1.5px solid var(--sage);margin-left:9px;}
  .center-v{flex:1;display:flex;flex-direction:column;justify-content:center;}
  .cover-frame{border:1.5px solid #fff;flex:1;background:linear-gradient(135deg,#6463aa 0%,#8e8cc4 55%,#ccc9e6 100%);
               display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;
               padding:24px;border-radius:4px;}
  .cover-frame h1{font-family:'Eternalo',Georgia,serif;font-size:50px;line-height:1.12;color:#fff;font-weight:normal;margin:10px 0;}
  .cover-frame h1 .script{font-family:'Photograph Signature',cursive;font-weight:normal;}
  .cover-frame .kicker{color:#f2f2f2;}
  .cover-sub{font-size:12.5px;font-style:italic;color:#fff;max-width:3.6in;line-height:1.6;}
  .year{font-family:'Eternalo',Georgia,serif;font-size:22px;letter-spacing:.45em;color:#fff;margin-top:22px;}
  .cover-note{font-size:11px;color:#f2f2f2;margin-top:14px;}

  .cal-head{display:grid;grid-template-columns:repeat(7,1fr);text-align:center;font-size:9.5px;
            color:#8e8cc4;font-weight:700;margin-bottom:4px;}
  .cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:3px;}
  .cal-cell{border:1px dashed var(--soft);border-radius:4px;padding:3px 4px;font-size:9.5px;min-height:.56in;background:#fff;}
  .cal-cell.empty{border-style:dotted;opacity:.5;}
  .dnum{color:var(--accent);font-weight:bold;}

  .tbl{width:100%;border-collapse:collapse;font-size:10px;}
  .tbl th,.tbl td{border:1px solid var(--soft);padding:3px 6px;text-align:left;}
  .tbl th{background:var(--cream);color:#6463aa;font-weight:bold;font-size:9px;letter-spacing:.05em;text-transform:uppercase;}
  .tbl td.h{height:23px;}
  .tbl.tight td.h{height:19px;}
  .tbl.mini th{font-size:7px;padding:2px 0;text-align:center;}
  .tbl.mini td.h{height:21px;}
  .dots{flex:1;border-radius:6px;background-image:radial-gradient(var(--line) 1px,transparent 1.4px);background-size:16px 16px;}
</style>
</head>
<body>
<div id="toolbar"><a href="#idx" class="toolbtn">Índice</a><button id="printBtn" onclick="window.print()">Imprimir / PDF</button><button class="toolbtn" onclick="if(confirm('¿Borrar todo lo que escribiste en este journal?')){localStorage.clear();location.reload();}">Borrar datos</button></div>
<div id="journal"></div>

<script>
/* ================= CONFIGURACIÓN ================= */
const YEAR = 2027;                 // Año del journal (cámbialo aquí)
const BOOK = 'Calma & Orden';
const MONTHS = ['Enero','Febrero','Marzo','Abril','Mayo','Junio','Julio','Agosto','Septiembre','Octubre','Noviembre','Diciembre'];
const WD  = ['Lunes','Martes','Miércoles','Jueves','Viernes','Sábado','Domingo'];
const WDS = ['L','M','X','J','V','S','D'];
const QUOTES = [
  'Un año tranquilo se construye con días honestos.',
  'El orden no es rigidez: es una forma de cuidarse.',
  'Pequeños pasos sostenidos recorren caminos largos.',
  'Respira: no todo tiene que resolverse hoy.',
  'Tu paz también es una forma de productividad.',
  'Haz menos cosas, pero hazlas con presencia.',
  'Descansar también es avanzar.',
  'La constancia amable transforma más que la intensidad.',
  'Empezar otra vez también es un logro.',
  'Primero lo esencial; después lo urgente.',
  'Gracias por lo vivido; listo(a) para lo nuevo.',
  'Cerrar con calma también es terminar bien.'
];
const PROMPTS = [
  {t:'Intención',         q:'¿Qué actitud quiero llevarme hoy?'},
  {t:'Gratitud',          q:'Hoy agradezco tres cosas pequeñas:'},
  {t:'Descarga mental',   q:'Lo que necesito sacar de mi cabeza ahora mismo es…'},
  {t:'Autoconocimiento',  q:'¿Qué necesitó hoy mi cuerpo o mi mente?'},
  {t:'Celebración',       q:'Un logro de esta semana, aunque sea pequeño:'},
  {t:'Placer simple',     q:'Algo que haré hoy solo(a), por puro gusto:'},
  {t:'Soltar',            q:'Dejo ir de esta semana:'}
];

/* ================= HELPERS ================= */
let out = '';
let numPg = 0;
let K = 0;
const key = () => 'k' + (K++);
function page(inner, foot, showNum, id){
  numPg++;
  const badge = (showNum === false) ? '' : '<div class="pagenum">'+numPg+'</div>';
  out += '<section class="page"' + (id ? ' id="'+id+'"' : '') + '>' + inner + badge +
         '<footer class="pgfoot">' + (foot || BOOK) + '</footer></section>';
}
const L = n => Array(n).fill(0).map(()=>'<input class="wline" data-key="'+key()+'">').join('');
const cl = () => '<div class="check-line"><span class="cb tick" data-key="'+key()+'"></span><input class="inline" data-key="'+key()+'"></div>';
const checks = n => Array(n).fill(0).map(cl).join('');
const lbl = t => '<div class="lbl">' + t + '</div>';
const gap = h => '<div style="height:' + h + 'px"></div>';

function calCells(y,m){
  const dim = new Date(y,m+1,0).getDate();
  const start = (new Date(y,m,1).getDay()+6)%7;
  let cells='';
  for(let i=0;i<start;i++) cells += '<div class="cal-cell empty"></div>';
  for(let d=1;d<=dim;d++)  cells += '<div class="cal-cell"><span class="dnum">'+d+'</span></div>';
  const rows = Math.ceil((start+dim)/7);
  for(let i=start+dim;i<rows*7;i++) cells += '<div class="cal-cell empty"></div>';
  return cells;
}
function weeksOf(y,m){
  const dim = new Date(y,m+1,0).getDate();
  const start = (new Date(y,m,1).getDay()+6)%7;
  const days = Array.from({length:dim},(_,i)=>i+1);
  const weeks=[]; 
  const first = days.splice(0, 7-start);
  if(first.length) weeks.push(first);
  while(days.length) weeks.push(days.splice(0,7));
  return weeks;
}

function dailyPage(m,d,foot){
  const wd = (new Date(YEAR,m,d).getDay()+6)%7;
  const p = PROMPTS[wd];
  page(
    '<div style="display:flex;justify-content:space-between;align-items:baseline;border-bottom:2px solid var(--soft);padding-bottom:6px;margin-bottom:12px;">' +
      '<h2 class="sec daily-title" style="border:none;margin:0;">'+WD[wd]+' '+d+'</h2>' +
      '<div>'+[1,2,3,4,5].map(()=>'<span class="mood-dot tick" data-key="'+key()+'" data-group="mood-'+m+'-'+d+'"></span>').join('')+'</div>' +
    '</div>' +
    lbl('Frase o mantra del día') + L(1) +
    '<h3 class="sub">Imprescindibles de hoy</h3>' + checks(3) +
    '<h3 class="sub">Si alcanzo, me gustaría…</h3>' + checks(2) +
    '<div class="box" style="margin-top:10px;">' +
      '<div class="lbl">Prompt · '+p.t+'</div>' +
      '<p class="body prompt-q" style="font-style:italic;margin:4px 0 6px;">'+p.q+'</p>' + L(3) +
    '</div>' +
    '<h3 class="sub">Cierre del día</h3>' +
    lbl('Una línea sobre cómo fue mi día') + L(1) +
    lbl('Mañana me gustaría empezar con') + L(1),
    foot);
}

function habitTable(m){
  const dim = new Date(YEAR,m+1,0).getDate();
  let head = '<tr><th style="width:1.05in;">Hábito</th>';
  for(let d=1;d<=dim;d++) head += '<th>'+d+'</th>';
  head += '<th style="width:.32in;">Total</th></tr>';
  let rows='';
  for(let h=0;h<6;h++){
    rows += '<tr><td class="h"><input class="tin" data-key="'+key()+'"></td>';
    for(let d=1;d<=dim;d++) rows += '<td class="h tick" data-key="'+key()+'"></td>';
    rows += '</tr>';
  }
  return '<table class="tbl mini" style="table-layout:fixed;">'+head+rows+'</table>';
}

/* ================= PORTADA Y APERTURA ================= */
page('<div class="cover-frame">' +
       '<div class="kicker">Agenda anual · Autocuidado + Organización</div>' +
       '<h1>Calma &<br><span class="script">orden</span></h1>' +
       '<p class="cover-sub">Un espacio para cuidar tu paz mental mientras ordenas tus días, tus tareas y tus metas.</p>' +
       '<div class="year">'+YEAR+'</div>' +
       '<p class="cover-note">Edición digital interactiva · Escribe directamente aquí, tus avances se guardan automáticamente</p>' +
     '</div>', '', false);

page('<div class="center-v">' +
       lbl('Este journal pertenece a') + L(2) + gap(22) +
       lbl('Comencé este viaje el') + L(1) + gap(30) +
       '<p class="body" style="text-align:center;font-style:italic;">“Que estas páginas sean un refugio y un mapa: refugio cuando el día pesa, mapa cuando toque avanzar.”</p>' +
     '</div>', '');

page('<h2 class="sec">Contenido</h2><ul class="list">' +
     '<li>Bienvenida y cómo usar este journal</li>' +
     '<li>Intenciones a mediano plazo</li>' +
     '<li>12 meses, cada uno con:</li>' +
     '<li style="margin-left:14px;">Portada e intención del mes</li>' +
     '<li style="margin-left:14px;">Calendario mensual y fechas clave</li>' +
     '<li style="margin-left:14px;">Objetivos, hábitos y descarga mental</li>' +
     '<li style="margin-left:14px;">Semanas con planificador por bloques y página diaria</li>' +
     '<li style="margin-left:14px;">Revisión semanal</li>' +
     '<li style="margin-left:14px;">Trackers: hábitos, finanzas, energía y estrés</li>' +
     '<li style="margin-left:14px;">Notas libres</li>' +
     '<li>Cierre: un año contigo</li>' +
     '</ul>' +
     '<h3 class="sub">Ir directo a un mes</h3>' +
     '<div class="monthnav">'+MONTHS.map((nm,i)=>'<a href="#mes-'+i+'">'+nm+'</a>').join('')+'</div>', '', true, 'idx');

page('<h2 class="sec">Bienvenida: un espacio para ti</h2>' +
     '<p class="body">Hola, bienvenido(a) a este espacio que será tuyo durante los próximos meses. Este journal nació de una idea sencilla: no tienes que elegir entre cuidar tu paz mental y mantener tu vida en orden. Aquí, ambas cosas viven juntas.</p>' +
     '<p class="body">En estas páginas encontrarás herramientas para organizar tus tareas, pendientes y metas, pero también espacios diseñados para respirar, reflexionar y reconectar contigo.</p>' +
     '<p class="body">No busques la perfección: este journal funciona cuando se usa con honestidad, no con exigencia.</p>' +
     gap(16) +
     '<div class="box"><p class="body" style="font-style:italic;margin:0;">“La calma no es ausencia de ocupaciones; es la forma en que decimos sí a lo importante.”</p></div>', '');

page('<h2 class="sec">Cómo usar este journal</h2><ul class="list">' +
     '<li><strong>Empieza por tus intenciones:</strong> dedica una sesión tranquila a esa sección antes de comenzar el primer mes.</li>' +
     '<li><strong>Un momento al día es suficiente:</strong> cinco minutos en la página diaria valen más que una hora perfecta que nunca llega.</li>' +
     '<li><strong>El autocuidado no es opcional:</strong> los bloques de bienestar están integrados en cada semana porque merecen el mismo lugar que tus responsabilidades.</li>' +
     '<li><strong>Sé flexible:</strong> si te saltas días, vuelve sin culpa. Este journal te espera sin juicios.</li>' +
     '</ul>', '');

page('<h2 class="sec">Tus intenciones a mediano plazo</h2>' +
     '<p class="body">Antes de organizar los días, define hacia dónde miras. Escribe con calma; puedes volver a esta página cada mes para recordarte el rumbo.</p>' +
     lbl('Mi intención para los próximos 3 meses') + L(2) + gap(10) +
     lbl('Lo que quiero lograr en 6 meses') + L(2) + gap(10) +
     lbl('La visión que tengo de mí dentro de un año') + L(2) + gap(10) +
     lbl('Una palabra que guiará esta etapa') + L(1) + gap(10) +
     lbl('Para cuidar mi paz mental, me comprometo a') + L(1) + gap(10) +
     lbl('Para ordenar mi día a día, me comprometo a') + L(1), '');

/* ================= MESES ================= */
for(let m=0;m<12;m++){
  const foot = BOOK + ' · ' + MONTHS[m] + ' ' + YEAR;

  // Portada del mes
  page('<div class="center-v" style="text-align:center;">' +
         '<div class="kicker">Mes de</div>' +
         '<h1 style="font-family:Eternalo,Georgia,serif;font-size:40px;color:#6463aa;font-weight:normal;">'+MONTHS[m]+'</h1>' +
         '<p style="font-style:italic;color:#77759f;margin:14px 0 34px;">“'+QUOTES[m]+'”</p>' +
         lbl('Intención del mes') + L(1) + gap(16) +
         lbl('Frase que me acompaña') + L(1) +
         '<div class="pagenav">' +
           (m>0?'<a href="#mes-'+(m-1)+'">← '+MONTHS[m-1]+'</a>':'<span></span>') +
           '<a href="#idx">Índice</a>' +
           (m<11?'<a href="#mes-'+(m+1)+'">'+MONTHS[m+1]+' →</a>':'<span></span>') +
         '</div>' +
       '</div>', foot, true, 'mes-'+m);

  // Calendario + fechas clave
  page('<h2 class="sec">Calendario de '+MONTHS[m]+'</h2>' +
       '<div class="cal-head">'+WDS.map(d=>'<span>'+d+'</span>').join('')+'</div>' +
       '<div class="cal-grid">'+calCells(YEAR,m)+'</div>' + gap(12) +
       '<div class="box"><div class="lbl">Fechas clave</div>'+L(3)+'</div>', foot);

  // Objetivos
  page('<h2 class="sec">Objetivos del mes</h2>' +
       '<p class="body">Máximo tres. Menos metas, más avance.</p>' +
       [1,2,3].map(i =>
         '<div class="box" style="margin-bottom:12px;">' +
           lbl('Objetivo '+i) + L(1) + gap(8) +
           lbl('Primer paso pequeño') + L(1) +
         '</div>').join(''), foot);

  // Hábitos + descarga mental
  page('<h2 class="sec">Hábitos y descarga mental</h2>' +
       '<h3 class="sub">Hábitos que cultivo este mes</h3>' +
       '<p class="body">Elige entre dos y cuatro. La constancia amable vale más que la intensidad.</p>' + L(3) +
       '<h3 class="sub">Descarga mental del mes</h3>' +
       '<p class="body">Vacía aquí todo lo que ronda tu cabeza antes de planificar las semanas: pendientes, ideas, preocupaciones.</p>' + L(6), foot);

  // Semanas
  const weeks = weeksOf(YEAR,m);
  weeks.forEach((days,wi)=>{
    const first=days[0], last=days[days.length-1];

    // Vista semanal
    page('<h2 class="sec">Semana '+(wi+1)+' · del '+first+' al '+last+'</h2>' +
         lbl('Top 3 prioridades de la semana') + checks(3) + gap(10) +
         lbl('Mi enfoque de bienestar esta semana') + L(1) + gap(10) +
         '<h3 class="sub">Agenda y compromisos</h3>' +
          '<table class="tbl">' + WD.map((w,i)=>
            '<tr><td style="width:.45in;text-align:center;color:var(--sage);font-weight:bold;">'+WDS[i]+'</td><td class="h"><input class="tin" data-key="'+key()+'"></td></tr>').join('') +
         '</table>' + gap(10) +
         lbl('Pausas mentales agendadas (no negociables)') + L(2), foot);

    // Páginas diarias
    days.forEach(d => dailyPage(m,d,foot));

    // Revisión semanal
    page('<h2 class="sec">Revisión semanal</h2>' +
         '<p class="body">Cinco minutos de honestidad. Semana del '+first+' al '+last+' de '+MONTHS[m]+'.</p>' +
         ['¿Qué logré y de qué me siento orgulloso(a)?',
          '¿Qué quedó pendiente y qué haré con ello? (reagendar, delegar o soltar)',
          '¿Cómo estuvo mi energía esta semana, del 1 al 10?',
          '¿Qué me ayudó a sentir calma?',
          'Algo amable que me diré para la próxima semana:'
         ].map(q => lbl(q)+L(2)+gap(8)).join(''), foot);
  });

  // Tracker de hábitos
  page('<h2 class="sec">Tracker de hábitos · '+MONTHS[m]+'</h2>' +
       '<p class="body">Marca, colorea o pega un punto por día cumplido.</p>' +
       habitTable(m), foot);

  // Finanzas A
  const cell = () => '<td class="h"><input class="tin" data-key="'+key()+'"></td>';
  let rowIng='', rowFix='';
  for(let i=0;i<6;i++) rowIng += '<tr>'+cell()+cell()+cell()+'</tr>';
  for(let i=0;i<9;i++) rowFix += '<tr>'+cell()+cell()+'</tr>';
  page('<h2 class="sec">Finanzas · Ingresos y gastos fijos</h2>' +
       '<h3 class="sub">Ingresos del mes</h3>' +
       '<table class="tbl"><tr><th style="width:.75in;">Fecha</th><th>Concepto</th><th style="width:.95in;">Monto</th></tr>'+rowIng+'</table>' +
       '<h3 class="sub">Gastos fijos</h3>' +
       '<table class="tbl"><tr><th>Concepto</th><th style="width:.95in;">Monto</th></tr>'+rowFix+'</table>', foot);

  // Finanzas B
  let rowVar='';
  for(let i=0;i<8;i++) rowVar += '<tr>'+cell()+cell()+cell()+cell()+'</tr>';
  page('<h2 class="sec">Finanzas · Variables, ahorro y balance</h2>' +
       '<h3 class="sub">Gastos variables</h3>' +
       '<table class="tbl"><tr><th style="width:.7in;">Fecha</th><th>Concepto</th><th style="width:.85in;">Categoría</th><th style="width:.85in;">Monto</th></tr>'+rowVar+'</table>' +
       '<h3 class="sub">Ahorro</h3>' +
       lbl('Meta del mes') + L(1) +
       lbl('Ahorrado real') + L(1) +
       '<h3 class="sub">Balance del mes</h3>' +
       lbl('¿En qué me gustaría gastar menos?') + L(1) +
       lbl('¿En qué vale la pena invertir más?') + L(1), foot);

  // Energía y estrés
  let rows31='';
  for(let d=1;d<=new Date(YEAR,m+1,0).getDate();d++)
    rows31 += '<tr><td style="text-align:center;color:var(--accent);font-weight:bold;">'+d+'</td><td class="h"><input class="tin" data-key="'+key()+'"></td><td class="h"><input class="tin" data-key="'+key()+'"></td><td class="h"><input class="tin" data-key="'+key()+'"></td></tr>';
  page('<h2 class="sec">Energía y estrés · '+MONTHS[m]+'</h2>' +
       '<p class="body">Registra rápido cada día: energía (1–5) y estrés (1–5). Al final del mes, mira tus patrones sin juzgarte.</p>' +
       '<table class="tbl tight"><tr><th style="width:.45in;">Día</th><th style="width:.85in;">Energía</th><th style="width:.85in;">Estrés</th><th>Nota breve</th></tr>'+rows31+'</table>', foot);

  // Notas libres
  page('<h2 class="sec">Notas libres</h2><div class="noteswrap"><div class="dots" style="position:absolute;inset:0;"></div><textarea class="notesarea" data-key="'+key()+'"></textarea></div>', foot);
}

     lbl('Un momento de este año que atesoraré siempre') + L(2) + gap(10) +

     lbl('Lo que aprendí sobre mí mismo(a)') + L(2) + gap(10) +
     lbl('Lo que quiero dejar ir antes de empezar de nuevo') + L(1) + gap(10) +
     lbl('Mi intención para el siguiente ciclo') + L(1) + gap(14) +
     '<div class="box"><p class="body" style="font-style:italic;margin:0;text-align:center;">“Gracias por regalarte estos meses de calma y orden. Esto apenas comienza.”</p></div>', '');

document.getElementById('journal').innerHTML = out;
/* ===== Interactividad: guardado automático en este dispositivo ===== */
(function(){
  const NS = 'cyo2027:';
  document.querySelectorAll('[data-key]').forEach(el=>{
    const k = NS + el.dataset.key;
    try{
      if(el.classList.contains('tick')){
        if(localStorage.getItem(k)==='on') el.classList.add('on');
        el.addEventListener('click', ()=>{
          const g = el.dataset.group;
          if(g){ document.querySelectorAll('[data-group="'+g+'"]').forEach(s=>{ s.classList.remove('on'); try{localStorage.setItem(NS+s.dataset.key,'');}catch(e){} }); }
          el.classList.add('on');
          try{localStorage.setItem(k,'on');}catch(e){}
        });
      } else {
        const v = localStorage.getItem(k);
        if(v!==null && v!=='') el.value = v;
        el.addEventListener('input', ()=>{ try{localStorage.setItem(k, el.value);}catch(e){} });
      }
    }catch(e){}
  });
})();
</script>

<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Planner Semanal 2027 — TDAH</title>
<style>
  :root{--ink:#3b3a52;--paper:#fff;--cream:#f2f2f2;--accent:#6463aa;--sage:#8f8dc7;--soft:#ccc9e6;--line:#ccc9e6;
        --red:#e07070;--yellow:#e0c870;--green:#70b870;}
  *{box-sizing:border-box;margin:0;padding:0;}
  body{font-family:'Urbanist','Segoe UI',sans-serif;color:var(--ink);background:#ececf1;padding:24px 0;}
  #planner{display:flex;flex-direction:column;align-items:center;gap:24px;}
  .page{width:6in;height:9in;background:var(--paper);padding:.55in .55in .45in;box-shadow:0 3px 14px rgba(60,50,35,.18);position:relative;display:flex;flex-direction:column;overflow:hidden;}
  .page.cover{padding:0;}
  .pgfoot{position:absolute;bottom:.24in;left:0;right:0;text-align:center;font-size:8px;letter-spacing:.14em;color:#9a98bd;text-transform:uppercase;}
  .pagenum{position:absolute;left:50%;transform:translateX(-50%);bottom:87px;width:28px;height:28px;border-radius:50%;background:#6463aa;color:#fff;font-size:11px;font-weight:bold;display:flex;align-items:center;justify-content:center;box-shadow:0 0 0 1px #ccc9e6;}
  @media print{body{background:#fff;padding:0;}#planner{display:block;gap:0;}.page{box-shadow:none;width:6in;height:9in;page-break-after:always;break-after:page;}.page:last-child{page-break-after:auto;}#toolbar{display:none;}}
  @page{size:6in 9in;margin:0;}
  #toolbar{position:fixed;top:14px;right:14px;z-index:99;display:flex;gap:8px;align-items:center;}
  .toolbtn{background:#fff;color:var(--accent);border:1.5px solid var(--soft);padding:9px 16px;border-radius:22px;font-family:inherit;font-size:13px;cursor:pointer;text-decoration:none;}
  .toolbtn:hover{background:var(--cream);}
  #printBtn{background:var(--sage);color:#fff;border:none;padding:10px 18px;border-radius:22px;font-family:inherit;font-size:13px;cursor:pointer;}

  .wline{display:block;width:100%;border:none;border-bottom:1px solid var(--line);height:26px;background:transparent;outline:none;font-family:inherit;font-size:12px;color:var(--ink);padding:0 2px;}
  .wline:focus{border-bottom-color:var(--accent);}
  .inline{flex:1;min-width:0;border:none;background:transparent;outline:none;font-family:inherit;font-size:12px;color:var(--ink);padding:0 2px;}
  .tin{width:100%;height:100%;border:none;background:transparent;outline:none;font-family:inherit;font-size:10px;color:var(--ink);padding:0;}
  .tick{cursor:pointer;}
  .cb.tick.on{background:var(--accent);border-color:var(--accent);}
  td.tick.on{background:#e4e0f4;}
  .monthnav{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:14px;}
  .monthnav a{border:1px solid var(--soft);border-radius:8px;padding:8px;text-align:center;font-size:12px;color:var(--accent);text-decoration:none;background:#fff;}
  .monthnav a:hover{background:var(--cream);}
  .pagenav{display:flex;justify-content:space-between;align-items:center;margin-top:18px;font-size:12px;gap:8px;}
  .pagenav a{color:var(--accent);text-decoration:none;border:1px solid var(--soft);border-radius:16px;padding:5px 14px;background:#fff;}
  .pagenav a:hover{background:var(--cream);}
  .noteswrap{position:relative;flex:1;min-height:200px;}
  .notesarea{position:absolute;inset:0;width:100%;height:100%;background:transparent;border:none;outline:none;font-family:inherit;font-size:12px;line-height:16px;color:var(--ink);resize:none;padding:0;}

  .kicker{font-size:10px;letter-spacing:.28em;text-transform:uppercase;color:var(--accent);margin-bottom:12px;}
  .sec{font-family:'Eternalo',Georgia,serif;font-size:26px;font-weight:normal;color:#6463aa;border-bottom:2px dashed var(--soft);padding-bottom:7px;margin-bottom:13px;}
  .sub{font-size:13.5px;color:var(--sage);margin:13px 0 7px;font-weight:700;}
  .body{font-size:11.5px;line-height:1.65;margin-bottom:9px;color:#4a4870;}
  .list{list-style:none;}
  .list li{padding-left:16px;position:relative;font-size:11.5px;line-height:1.5;margin-bottom:7px;}
  .list li::before{content:'—';position:absolute;left:0;color:var(--accent);}
  .lbl{font-size:9.5px;letter-spacing:.09em;text-transform:uppercase;color:#7876a0;margin-bottom:1px;font-weight:700;}
  .box{border:1.5px solid var(--soft);border-radius:8px;background:#f8f8fa;padding:12px 14px;}
  .cb{display:inline-block;width:11px;height:11px;border:1.5px solid var(--accent);border-radius:3px;margin-right:8px;flex:none;}
  .check-line{display:flex;align-items:flex-end;border-bottom:1px solid var(--line);height:29px;padding-bottom:4px;}
  .center-v{flex:1;display:flex;flex-direction:column;justify-content:center;}
  .cover-frame{position:absolute;inset:0;background:linear-gradient(135deg,#6463aa 0%,#8e8cc4 55%,#ccc9e6 100%);display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;padding:40px 24px;z-index:0;}
  .cover-frame h1{font-family:'Eternalo',Georgia,serif;font-size:44px;line-height:1.12;color:#fff;font-weight:normal;margin:10px 0;}
  .cover-frame .kicker{color:#f2f2f2;}
  .cover-sub{font-size:12.5px;font-style:italic;color:#fff;max-width:3.6in;line-height:1.6;}
  .year{font-family:'Eternalo',Georgia,serif;font-size:22px;letter-spacing:.45em;color:#fff;margin-top:22px;}
  .cover-note{font-size:11px;color:#f2f2f2;margin-top:14px;}

  /* TDAH: Prioridades Visuales */
  .priority-row{display:flex;gap:10px;margin-bottom:10px;align-items:stretch;}
  .priority-box{flex:1;border:2px solid var(--soft);border-radius:10px;padding:10px;text-align:center;min-height:80px;display:flex;flex-direction:column;align-items:center;justify-content:center;position:relative;}
  .priority-box .num{font-family:'Eternalo',Georgia,serif;font-size:28px;color:var(--accent);font-weight:normal;line-height:1;}
  .priority-box .task{font-size:11px;color:var(--ink);margin-top:4px;}
  .priority-box input{border:none;background:transparent;text-align:center;font-family:inherit;font-size:11px;color:var(--ink);width:100%;outline:none;}
  .priority-box input::placeholder{color:var(--sage);font-style:italic;}
  .traffic{display:flex;gap:6px;margin-bottom:12px;}
  .traffic-dot{width:22px;height:22px;border-radius:50%;border:2px solid;display:flex;align-items:center;justify-content:center;cursor:pointer;font-size:10px;}
  .traffic-dot.r{border-color:var(--red);}.traffic-dot.r.on{background:var(--red);color:#fff;}
  .traffic-dot.y{border-color:var(--yellow);}.traffic-dot.y.on{background:var(--yellow);color:#fff;}
  .traffic-dot.g{border-color:var(--green);}.traffic-dot.g.on{background:var(--green);color:#fff;}

  .cal-head{display:grid;grid-template-columns:repeat(7,1fr);text-align:center;font-size:9.5px;color:#8e8cc4;font-weight:700;margin-bottom:4px;}
  .cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:3px;}
  .cal-cell{border:1px dashed var(--soft);border-radius:4px;padding:3px 4px;font-size:9.5px;min-height:.56in;background:#fff;}
  .cal-cell.empty{border-style:dotted;opacity:.5;}
  .dnum{color:var(--accent);font-weight:bold;}

  .tbl{width:100%;border-collapse:collapse;font-size:10px;}
  .tbl th,.tbl td{border:1px solid var(--soft);padding:3px 6px;text-align:left;}
  .tbl th{background:var(--cream);color:#6463aa;font-weight:bold;font-size:9px;letter-spacing:.05em;text-transform:uppercase;}
  .tbl td.h{height:23px;}
  .tbl.tight td.h{height:19px;}
  .tbl.mini th{font-size:7px;padding:2px 0;text-align:center;}
  .tbl.mini td.h{height:21px;}
  .dots{flex:1;border-radius:6px;background-image:radial-gradient(var(--line) 1px,transparent 1.4px);background-size:16px 16px;}

  .timer-box{border:2px dashed var(--accent);border-radius:10px;padding:12px;text-align:center;margin:10px 0;}
  .timer-box .lbl{margin-bottom:6px;}
</style>
</head>
<body>
<div id="toolbar"><a href="#idx" class="toolbtn">Índice</a><button id="printBtn" onclick="window.print()">Imprimir / PDF</button><button class="toolbtn" onclick="if(confirm('¿Borrar todo?')){localStorage.clear();location.reload();}">Borrar datos</button></div>
<div id="planner"></div>

<script>
const YEAR = 2027;
const BOOK = 'Planner TDAH';
const MONTHS = ['Enero','Febrero','Marzo','Abril','Mayo','Junio','Julio','Agosto','Septiembre','Octubre','Noviembre','Diciembre'];
const WD = ['Lunes','Martes','Miércoles','Jueves','Viernes','Sábado','Domingo'];
const WDS = ['L','M','X','J','V','S','D'];
const QUOTES = [
  'Tu cerebro no está roto. Solo funciona diferente.',
  'Lo hecho está hecho. Hoy es nuevo.',
  'No es procrastinación. Es descanso que necesitabas.',
  'Empezá de nuevo. Sin culpa.',
  'Tu ritmo es válido.',
  'Pequeños pasos siguen siendo pasos.',
  'No necesitás ser perfecto. Solo presente.',
  'Hoy elijo lo esencial.',
  'Si es muy grande, partilo. Si es muy pequeño, hacelo.',
  'Tu energía merece un plan, no una exigencia.',
  'Está bien ir lento. Lo que no está bien es detenerse.',
  'Celebrá cada cosita.'
];

let out = '';
let numPg = 0;
let K = 0;
const key = () => 'td' + (K++);
function page(inner, foot, showNum, id, cls){
  numPg++;
  const badge = (showNum === false) ? '' : '<div class="pagenum">'+numPg+'</div>';
  out += '<section class="page' + (cls ? ' '+cls : '') + '"' + (id ? ' id="'+id+'"' : '') + '>' + inner + badge +
         '<footer class="pgfoot">' + (foot || BOOK) + '</footer></section>';
}
const L = n => Array(n).fill(0).map(()=>'<input class="wline" data-key="'+key()+'">').join('');
const cl = () => '<div class="check-line"><span class="cb tick" data-key="'+key()+'"></span><input class="inline" data-key="'+key()+'"></div>';
const checks = n => Array(n).fill(0).map(cl).join('');
const lbl = t => '<div class="lbl">' + t + '</div>';
const gap = h => '<div style="height:' + h + 'px"></div>';

function calCells(y,m){
  const dim = new Date(y,m+1,0).getDate();
  const start = (new Date(y,m,1).getDay()+6)%7;
  let cells='';
  for(let i=0;i<start;i++) cells += '<div class="cal-cell empty"></div>';
  for(let d=1;d<=dim;d++) cells += '<div class="cal-cell"><span class="dnum">'+d+'</span></div>';
  const rows = Math.ceil((start+dim)/7);
  for(let i=start+dim;i<rows*7;i++) cells += '<div class="cal-cell empty"></div>';
  return cells;
}
function weeksOf(y,m){
  const dim = new Date(y,m+1,0).getDate();
  const start = (new Date(y,m,1).getDay()+6)%7;
  const days = Array.from({length:dim},(_,i)=>i+1);
  const weeks=[];
  const first = days.splice(0, 7-start);
  if(first.length) weeks.push(first);
  while(days.length) weeks.push(days.splice(0,7));
  return weeks;
}

function dailyPage(m,d,foot){
  const wd = (new Date(YEAR,m,d).getDay()+6)%7;
  page(
    '<div style="display:flex;justify-content:space-between;align-items:baseline;border-bottom:2px solid var(--soft);padding-bottom:6px;margin-bottom:12px;">' +
      '<h2 class="sec" style="border:none;margin:0;font-size:19px;font-family:Urbanist,sans-serif;font-weight:700;">'+WD[wd]+' '+d+'</h2>' +
      '<div class="traffic" data-key="traffic-'+m+'-'+d+'">' +
        '<span class="traffic-dot r" data-val="r"></span>' +
        '<span class="traffic-dot y" data-val="y"></span>' +
        '<span class="traffic-dot g" data-val="g"></span>' +
      '</div>' +
    '</div>' +
    '<h3 class="sub">Mis 3 prioridades de hoy</h3>' +
    '<div class="priority-row">' +
      [1,2,3].map(n => '<div class="priority-box"><div class="num">'+n+'</div><input placeholder="¿Qué es lo #'+n+'?" data-key="'+key()+'"></div>').join('') +
    '</div>' +
    '<h3 class="sub">Si me sobra tiempo…</h3>' + checks(2) +
    '<div class="timer-box">' +
      '<div class="lbl">⏱ Bloque de enfoque</div>' +
      '<div style="display:flex;gap:8px;justify-content:center;">' +
        '<div><div class="lbl">Inicio</div><input class="tin" data-key="'+key()+'" style="width:60px;text-align:center;"></div>' +
        '<div><div class="lbl">Fin</div><input class="tin" data-key="'+key()+'" style="width:60px;text-align:center;"></div>' +
        '<div><div class="lbl">¿En qué trabajé?</div><input class="tin" data-key="'+key()+'" style="width:140px;"></div>' +
      '</div>' +
    '</div>' +
    '<h3 class="sub">Cómo me fue hoy</h3>' +
    lbl('Una línea sobre mi día') + L(1) +
    lbl('Mañana quiero empezar con') + L(1),
    foot);
}

function habitTable(m){
  const dim = new Date(YEAR,m+1,0).getDate();
  let head = '<tr><th style="width:1.05in;">Hábito</th>';
  for(let d=1;d<=dim;d++) head += '<th>'+d+'</th>';
  head += '<th style="width:.32in;">Total</th></tr>';
  let rows='';
  for(let h=0;h<4;h++){
    rows += '<tr><td class="h"><input class="tin" data-key="'+key()+'"></td>';
    for(let d=1;d<=dim;d++) rows += '<td class="h tick" data-key="'+key()+'"></td>';
    rows += '</tr>';
  }
  return '<table class="tbl mini" style="table-layout:fixed;">'+head+rows+'</table>';
}

/* PORTADA */
page('<div class="cover-frame">' +
       '<div class="kicker">Planner TDAH · '+YEAR+'</div>' +
       '<h1 style="font-family:Eternalo,Georgia,serif;font-size:44px;color:#fff;font-weight:normal;">Planner<br>TDAH</h1>' +
       '<p class="cover-sub">Diseñado para cerebros que funcionan diferente. Menos texto, más acción, prioridades visuales.</p>' +
       '<div class="year">'+YEAR+'</div>' +
       '<p class="cover-note">Edición digital interactiva · Tus datos se guardan automáticamente</p>' +
     '</div>', '', false, null, 'cover');

page('<div class="center-v">' +
       lbl('Este planner pertenece a') + L(2) + gap(22) +
       lbl('Empecé a planificar el') + L(1) + gap(30) +
       '<p class="box" style="text-align:center;"><p class="body" style="font-style:italic;margin:0;">"No tenés que hacer todo. Solo necesitás hacer lo que importa, a tu ritmo."</p></div>', '');

page('<h2 class="sec">Cómo funciona este planner</h2><ul class="list">' +
     '<li><strong>Prioridades visuales:</strong> cada día tiene 3 cuadros grandes. Escribí UNA tarea en cada uno.</li>' +
     '<li><strong>Semáforo de energía:</strong> marcá cómo estás hoy: rojo (bajo), amarillo (ok), verde (bien).</li>' +
     '<li><strong>Bloque de enfoque:</strong> elegí UNA hora para concentrarte. Solo una.</li>' +
     '<li><strong>Sin presión:</strong> si un día no sale, mañana es otro día. Sin culpa.</li>' +
     '<li><strong>Revisión semanal:</strong> 5 preguntas para cerrar la semana con honestidad.</li>' +
     '</ul>' +
     '<h3 class="sub">Ir directo a un mes</h3>' +
     '<div class="monthnav">'+MONTHS.map((nm,i)=>'<a href="#mes-'+i+'">'+nm+'</a>').join('')+'</div>', '', true, 'idx');

/* MESES */
for(let m=0;m<12;m++){
  const foot = BOOK + ' · ' + MONTHS[m] + ' ' + YEAR;

  page('<div class="center-v" style="text-align:center;">' +
         '<div class="kicker">Mes de</div>' +
         '<h1 style="font-family:Eternalo,Georgia,serif;font-size:40px;color:#6463aa;font-weight:normal;">'+MONTHS[m]+'</h1>' +
         '<p style="font-style:italic;color:#77759f;margin:14px 0 34px;">"'+QUOTES[m]+'"</p>' +
         lbl('Mi enfoque este mes (solo 1)') + L(1) + gap(16) +
         lbl('Lo que quiero lograr') + L(2) +
         '<div class="pagenav">' +
           (m>0?'<a href="#mes-'+(m-1)+'">← '+MONTHS[m-1]+'</a>':'<span></span>') +
           '<a href="#idx">Índice</a>' +
           (m<11?'<a href="#mes-'+(m+1)+'">'+MONTHS[m+1]+' →</a>':'<span></span>') +
         '</div>' +
       '</div>', foot, true, 'mes-'+m);

  page('<h2 class="sec">Calendario de '+MONTHS[m]+'</h2>' +
       '<div class="cal-head">'+WDS.map(d=>'<span>'+d+'</span>').join('')+'</div>' +
       '<div class="cal-grid">'+calCells(YEAR,m)+'</div>' + gap(12) +
       '<div class="box"><div class="lbl">Fechas importantes</div>'+L(2)+'</div>', foot);

  page('<h2 class="sec">Objetivos del mes</h2>' +
       '<p class="body">Solo 2. Menos es más.</p>' +
       [1,2].map(i =>
         '<div class="box" style="margin-bottom:12px;">' +
           lbl('Objetivo '+i) + L(1) + gap(8) +
           lbl('Primer paso') + L(1) +
         '</div>').join(''), foot);

  page('<h2 class="sec">Hábitos del mes</h2>' +
       '<p class="body">Elegí máximo 3 hábitos. Pequeños y constantes.</p>' + L(3), foot);

  const weeks = weeksOf(YEAR,m);
  weeks.forEach((days,wi)=>{
    const first=days[0], last=days[days.length-1];

    page('<h2 class="sec">Semana '+(wi+1)+' · del '+first+' al '+last+'</h2>' +
         lbl('Mi enfoque esta semana (solo 1)') + L(1) + gap(10) +
         lbl('3 cosas que necesito esta semana') + checks(3) + gap(10) +
         '<h3 class="sub">Lo que necesito para tener buena semana</h3>' +
         lbl('¿Qué necesito de mí mismo(a)?') + L(1) +
         lbl('¿Qué necesito de otros?') + L(1), foot);

    days.forEach(d => dailyPage(m,d,foot));

    page('<h2 class="sec">Revisión semanal</h2>' +
         '<p class="body">Semana del '+first+' al '+last+' de '+MONTHS[m]+'. Respondé con honestidad, sin juicio.</p>' +
         ['¿Qué funcionó esta semana?',
          '¿Qué no funcionó y qué cambio?',
          '¿Cómo estuvo mi energía del 1 al 10?',
          '¿Qué me ayudó a concentrarme?',
          'Un recordatorio amable para la próxima semana:'
         ].map(q => lbl(q)+L(2)+gap(8)).join(''), foot);
  });

  page('<h2 class="sec">Tracker de hábitos · '+MONTHS[m]+'</h2>' +
       '<p class="body">Check por cada día que lo hiciste. Sin presión.</p>' +
       habitTable(m), foot);

  page('<h2 class="sec">Notas libres</h2><div class="noteswrap"><div class="dots" style="position:absolute;inset:0;"></div><textarea class="notesarea" data-key="'+key()+'"></textarea></div>', foot);
}

document.getElementById('planner').innerHTML = out;
(function(){
  const NS = 'td2027:';
  document.querySelectorAll('[data-key]').forEach(el=>{
    const k = NS + el.dataset.key;
    try{
      if(el.classList.contains('tick')){
        if(localStorage.getItem(k)==='on') el.classList.add('on');
        el.addEventListener('click', ()=>{
          el.classList.toggle('on');
          try{localStorage.setItem(k, el.classList.contains('on')?'on':'');}catch(e){}
        });
      } else {
        const v = localStorage.getItem(k);
        if(v!==null && v!=='') el.value = v;
        el.addEventListener('input', ()=>{ try{localStorage.setItem(k, el.value);}catch(e){} });
      }
    }catch(e){}
  });
  /* Semáforo */
  document.querySelectorAll('.traffic').forEach(t=>{
    const k = NS + t.dataset.key;
    const saved = localStorage.getItem(k);
    if(saved) t.querySelector('.traffic-dot.'+saved)?.classList.add('on');
    t.querySelectorAll('.traffic-dot').forEach(dot=>{
      dot.addEventListener('click', ()=>{
        t.querySelectorAll('.traffic-dot').forEach(d=>d.classList.remove('on'));
        dot.classList.add('on');
        try{localStorage.setItem(k, dot.dataset.val);}catch(e){}
      });
    });
  });
})();
</script>
</body>
</html>

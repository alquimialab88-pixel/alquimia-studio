  <!-- ============ Avisos de red / actualización ============ -->
  <div id="netBanner" class="banner banner-net" role="status" hidden>
    <span class="banner-dot"></span><span id="netText"></span>
  </div>
  <div id="updateBanner" class="banner banner-update" role="status" hidden>
    <span id="updateText"></span>
    <button type="button" class="banner-action" id="updateBtn"></button>
  </div>

  <!-- ============ App ============ -->
  <div id="app">
    <main id="view" class="view" aria-live="polite"></main>

    <nav id="tabbar" class="tabbar" aria-label="Navegación principal" hidden>
      <a class="tab" href="#/home" data-tab="home">
        <svg class="icon" aria-hidden="true"><use href="#i-home"></use></svg><span data-i18n="tabInicio">Inicio</span>
      </a>
      <a class="tab" href="#/notes" data-tab="notes">
        <svg class="icon" aria-hidden="true"><use href="#i-note"></use></svg><span data-i18n="notas">Notas</span>
      </a>
      <a class="tab" href="#/calendar" data-tab="calendar">
        <svg class="icon" aria-hidden="true"><use href="#i-calendar"></use></svg><span data-i18n="tabCalendario">Calendario</span>
      </a>
      <a class="tab" href="#/notebooks" data-tab="notebooks">
        <svg class="icon" aria-hidden="true"><use href="#i-book"></use></svg><span data-i18n="cuadernos">Cuadernos</span>
      </a>
      <a class="tab" href="#/menu" data-tab="menu">
        <svg class="icon" aria-hidden="true"><use href="#i-menu"></use></svg><span data-i18n="tabMenu">Menú</span>
      </a>
    </nav>

    <div id="boot" class="boot">
      <div class="boot-logo"><img src="icons/icon-192.png" alt="Stickly"></div>
      <p class="boot-name">Stickly</p>
      <p class="boot-tag">Alquimia Lab</p>
      <div class="boot-spinner" aria-hidden="true"></div>
    </div>
  </div>

  <div id="modalRoot"></div>
  <div id="pinRoot"></div>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>

  <noscript>
    <div class="noscript">Stickly necesita JavaScript para funcionar. Actívalo y vuelve a cargar la página.</div>
  </noscript>

  <script type="module" src="js/app.js"></script>

</html>

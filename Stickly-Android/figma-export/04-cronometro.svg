<svg xmlns="http://www.w3.org/2000/svg" width="360" height="800" viewBox="0 0 360 800" font-family="Roboto, Arial, sans-serif">
  <rect id="Background" width="360" height="800" fill="#F8F7FB"/>

  <g id="Header Fase">
    <text id="Fase Actual" x="180" y="80" font-size="20" font-weight="700" fill="#6463AA" text-anchor="middle">Estudio</text>
    <text id="Ciclo" x="180" y="102" font-size="13" fill="#2A2A3E" opacity="0.55" text-anchor="middle">Ciclo 0</text>
  </g>

  <g id="Dial Cronometro">
    <circle id="Anillo Fondo" cx="180" cy="250" r="123" fill="none" stroke="#EDECF8" stroke-width="14"/>
    <circle id="Arco Progreso" cx="180" cy="250" r="122" fill="none" stroke="#6463AA" stroke-width="16" stroke-linecap="round" stroke-dasharray="766 0" transform="rotate(-90 180 250)"/>

    <g id="Marcas Dial" stroke-linecap="round">
      <line x1="180" y1="113" x2="180" y2="120" stroke="#6463AA" stroke-opacity="0.65" stroke-width="3"/>
      <line x1="248.5" y1="131.5" x2="244.9" y2="137.9" stroke="#2A2A3E" stroke-opacity="0.25" stroke-width="1.5"/>
      <line x1="298.5" y1="181.5" x2="292.1" y2="185.1" stroke="#2A2A3E" stroke-opacity="0.25" stroke-width="1.5"/>
      <line x1="317" y1="250" x2="310" y2="250" stroke="#6463AA" stroke-opacity="0.65" stroke-width="3"/>
      <line x1="298.5" y1="318.5" x2="292.1" y2="314.9" stroke="#2A2A3E" stroke-opacity="0.25" stroke-width="1.5"/>
      <line x1="248.5" y1="368.5" x2="244.9" y2="362.1" stroke="#2A2A3E" stroke-opacity="0.25" stroke-width="1.5"/>
      <line x1="180" y1="387" x2="180" y2="380" stroke="#6463AA" stroke-opacity="0.65" stroke-width="3"/>
      <line x1="111.5" y1="368.5" x2="115.1" y2="362.1" stroke="#2A2A3E" stroke-opacity="0.25" stroke-width="1.5"/>
      <line x1="61.5" y1="318.5" x2="67.9" y2="314.9" stroke="#2A2A3E" stroke-opacity="0.25" stroke-width="1.5"/>
      <line x1="43" y1="250" x2="50" y2="250" stroke="#6463AA" stroke-opacity="0.65" stroke-width="3"/>
      <line x1="61.5" y1="181.5" x2="67.9" y2="185.1" stroke="#2A2A3E" stroke-opacity="0.25" stroke-width="1.5"/>
      <line x1="111.5" y1="131.5" x2="115.1" y2="137.9" stroke="#2A2A3E" stroke-opacity="0.25" stroke-width="1.5"/>
    </g>

    <text id="Tiempo" x="180" y="268" font-size="52" font-weight="700" fill="#4A4990" text-anchor="middle">25:00</text>
  </g>

  <g id="Botones Control">
    <g id="Boton Iniciar">
      <rect x="82" y="420" width="96" height="44" rx="16" fill="#6463AA"/>
      <path d="M108 434l10 8-10 8z" fill="#FFFFFF"/>
      <text x="150" y="447" font-size="14" font-weight="600" fill="#FFFFFF" text-anchor="middle">Iniciar</text>
    </g>
    <g id="Boton Reiniciar">
      <rect x="186" y="420" width="100" height="44" rx="16" fill="none" stroke="#6463AA" stroke-width="1.5"/>
      <path d="M212 434a8 8 0 108 8" stroke="#6463AA" stroke-width="2" fill="none" stroke-linecap="round"/>
      <text x="256" y="447" font-size="14" fill="#2A2A3E" text-anchor="middle">Reiniciar</text>
    </g>
  </g>

  <g id="Barra Inferior">
    <rect x="0" y="704" width="360" height="72" rx="24" fill="#FFFFFF"/>
    <g id="Tab Inicio">
      <path d="M30 738l10-8 10 8v10a2 2 0 01-2 2h-6v-6h-4v6h-6a2 2 0 01-2-2z" fill="#2A2A3E" opacity="0.45"/>
      <text x="40" y="768" font-size="10" fill="#2A2A3E" opacity="0.45" text-anchor="middle">Inicio</text>
    </g>
    <g id="Tab Calendario">
      <rect x="94" y="730" width="18" height="16" rx="2" fill="none" stroke="#2A2A3E" opacity="0.45" stroke-width="2"/>
      <text x="112" y="768" font-size="10" fill="#2A2A3E" opacity="0.45" text-anchor="middle">Calendario</text>
    </g>
    <g id="FAB Crear">
      <circle cx="180" cy="740" r="27" fill="#8B89D9"/>
      <path d="M180 728v24M168 740h24" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round"/>
    </g>
    <g id="Tab Cronometro Activo">
      <circle cx="248" cy="738" r="9" fill="none" stroke="#6463AA" stroke-width="2"/>
      <text x="248" y="768" font-size="10" font-weight="600" fill="#6463AA" text-anchor="middle">Temporizador</text>
    </g>
    <g id="Tab Menu">
      <path d="M312 732h16M312 738h16M312 744h16" stroke="#2A2A3E" opacity="0.45" stroke-width="2" stroke-linecap="round"/>
      <text x="320" y="768" font-size="10" fill="#2A2A3E" opacity="0.45" text-anchor="middle">Menú</text>
    </g>
    <rect id="Gesture Bar" x="130" y="788" width="100" height="4" rx="2" fill="#2A2A3E" opacity="0.3"/>
  </g>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" width="360" height="800" viewBox="0 0 360 800" font-family="Roboto, Arial, sans-serif">
  <rect id="Background" width="360" height="800" fill="#F8F7FB"/>

  <g id="Header Titulo">
    <text id="Titulo" x="16" y="52" font-size="24" font-weight="700" fill="#2A2A3E">Calendario</text>
  </g>

  <g id="Pestanas Mes Ano">
    <rect x="16" y="72" width="328" height="40" rx="14" fill="#FFFFFF"/>
    <text id="Mes" x="100" y="97" font-size="14" font-weight="600" fill="#2A2A3E" opacity="0.65" text-anchor="middle">Mes</text>
    <rect id="Pestana Ano Activa" x="180" y="76" width="160" height="32" rx="12" fill="#6463AA"/>
    <text id="Ano" x="260" y="97" font-size="14" font-weight="600" fill="#FFFFFF" text-anchor="middle">Año</text>
  </g>

  <g id="Grid Anio 12 Meses">
    <g id="Mes Enero">
      <rect x="16" y="132" width="76" height="74" rx="14" fill="#FFFFFF"/>
      <text x="54" y="162" font-size="12" font-weight="600" fill="#2A2A3E" text-anchor="middle">Ene</text>
      <text x="54" y="180" font-size="10" fill="#2A2A3E" opacity="0.45" text-anchor="middle">2026</text>
    </g>
    <g id="Mes Febrero">
      <rect x="98" y="132" width="76" height="74" rx="14" fill="#FFFFFF"/>
      <text x="136" y="162" font-size="12" font-weight="600" fill="#2A2A3E" text-anchor="middle">Feb</text>
      <text x="136" y="180" font-size="10" fill="#2A2A3E" opacity="0.45" text-anchor="middle">2026</text>
    </g>
    <g id="Mes Marzo">
      <rect x="180" y="132" width="76" height="74" rx="14" fill="#FFFFFF"/>
      <text x="218" y="162" font-size="12" font-weight="600" fill="#2A2A3E" text-anchor="middle">Mar</text>
      <text x="218" y="180" font-size="10" fill="#2A2A3E" opacity="0.45" text-anchor="middle">2026</text>
    </g>
    <g id="Mes Abril">
      <rect x="262" y="132" width="76" height="74" rx="14" fill="#FFFFFF"/>
      <text x="300" y="162" font-size="12" font-weight="600" fill="#2A2A3E" text-anchor="middle">Abr</text>
      <text x="300" y="180" font-size="10" fill="#2A2A3E" opacity="0.45" text-anchor="middle">2026</text>
    </g>

    <g id="Mes Mayo">
      <rect x="16" y="212" width="76" height="74" rx="14" fill="#FFFFFF"/>
      <text x="54" y="242" font-size="12" font-weight="600" fill="#2A2A3E" text-anchor="middle">May</text>
      <text x="54" y="260" font-size="10" fill="#2A2A3E" opacity="0.45" text-anchor="middle">2026</text>
    </g>
    <g id="Mes Junio">
      <rect x="98" y="212" width="76" height="74" rx="14" fill="#FFFFFF"/>
      <text x="136" y="242" font-size="12" font-weight="600" fill="#2A2A3E" text-anchor="middle">Jun</text>
      <text x="136" y="260" font-size="10" fill="#2A2A3E" opacity="0.45" text-anchor="middle">2026</text>
    </g>
    <g id="Mes Julio">
      <rect x="180" y="212" width="76" height="74" rx="14" fill="#FFFFFF"/>
      <text x="218" y="242" font-size="12" font-weight="600" fill="#2A2A3E" text-anchor="middle">Jul</text>
      <text x="218" y="260" font-size="10" fill="#2A2A3E" opacity="0.45" text-anchor="middle">2026</text>
    </g>
    <g id="Mes Agosto">
      <rect x="262" y="212" width="76" height="74" rx="14" fill="#FFFFFF"/>
      <text x="300" y="242" font-size="12" font-weight="600" fill="#2A2A3E" text-anchor="middle">Ago</text>
      <text x="300" y="260" font-size="10" fill="#2A2A3E" opacity="0.45" text-anchor="middle">2026</text>
    </g>

    <g id="Mes Septiembre">
      <rect x="16" y="292" width="76" height="74" rx="14" fill="#FFFFFF"/>
      <text x="54" y="322" font-size="12" font-weight="600" fill="#2A2A3E" text-anchor="middle">Sep</text>
      <text x="54" y="340" font-size="10" fill="#2A2A3E" opacity="0.45" text-anchor="middle">2026</text>
    </g>
    <g id="Mes Octubre Actual Con Tarea">
      <rect x="98" y="292" width="76" height="74" rx="14" fill="#EDECF8"/>
      <text x="136" y="322" font-size="12" font-weight="600" fill="#4A4990" text-anchor="middle">Oct</text>
      <text x="136" y="340" font-size="10" fill="#2A2A3E" opacity="0.45" text-anchor="middle">2026</text>
      <circle cx="136" cy="352" r="2.5" fill="#6463AA"/>
    </g>
    <g id="Mes Noviembre">
      <rect x="180" y="292" width="76" height="74" rx="14" fill="#FFFFFF"/>
      <text x="218" y="322" font-size="12" font-weight="600" fill="#2A2A3E" text-anchor="middle">Nov</text>
      <text x="218" y="340" font-size="10" fill="#2A2A3E" opacity="0.45" text-anchor="middle">2026</text>
    </g>
    <g id="Mes Diciembre">
      <rect x="262" y="292" width="76" height="74" rx="14" fill="#FFFFFF"/>
      <text x="300" y="322" font-size="12" font-weight="600" fill="#2A2A3E" text-anchor="middle">Dic</text>
      <text x="300" y="340" font-size="10" fill="#2A2A3E" opacity="0.45" text-anchor="middle">2026</text>
    </g>
  </g>

  <g id="Navegador Anio">
    <path d="M160 398l-6 6 6 6" stroke="#6463AA" stroke-width="2" fill="none" stroke-linecap="round"/>
    <text id="Anio" x="180" y="411" font-size="18" font-weight="700" fill="#2A2A3E" text-anchor="middle">2026</text>
    <path d="M200 398l6 6-6 6" stroke="#6463AA" stroke-width="2" fill="none" stroke-linecap="round"/>
  </g>

  <g id="Seccion Tareas Del Dia">
    <text id="FechaSeleccionada" x="16" y="450" font-size="16" font-weight="700" fill="#2A2A3E">mié, 21 oct</text>
    <rect x="16" y="466" width="328" height="44" rx="14" fill="#FFFFFF"/>
    <text x="180" y="493" font-size="13" fill="#2A2A3E" opacity="0.5" text-anchor="middle">Sin tareas para este día.</text>
  </g>

  <g id="Boton Anadir Tarea">
    <rect x="16" y="530" width="328" height="48" rx="16" fill="none" stroke="#6463AA" stroke-width="1.5"/>
    <path d="M145 548v12M139 554h12" stroke="#2A2A3E" stroke-width="2" stroke-linecap="round"/>
    <text x="195" y="560" font-size="14" font-weight="600" fill="#2A2A3E">Añadir tarea</text>
  </g>

  <g id="Barra Inferior">
    <rect x="0" y="704" width="360" height="72" rx="24" fill="#FFFFFF"/>
    <g id="Tab Inicio">
      <path d="M30 738l10-8 10 8v10a2 2 0 01-2 2h-6v-6h-4v6h-6a2 2 0 01-2-2z" fill="#2A2A3E" opacity="0.45"/>
      <text x="40" y="768" font-size="10" fill="#2A2A3E" opacity="0.45" text-anchor="middle">Inicio</text>
    </g>
    <g id="Tab Calendario Activo">
      <rect x="94" y="730" width="18" height="16" rx="2" fill="#6463AA"/>
      <text x="112" y="768" font-size="10" font-weight="600" fill="#6463AA" text-anchor="middle">Calendario</text>
    </g>
    <g id="FAB Crear">
      <circle cx="180" cy="740" r="27" fill="#8B89D9"/>
      <path d="M180 728v24M168 740h24" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round"/>
    </g>
    <g id="Tab Cronometro">
      <circle cx="248" cy="738" r="9" fill="none" stroke="#2A2A3E" opacity="0.45" stroke-width="2"/>
      <text x="248" y="768" font-size="10" fill="#2A2A3E" opacity="0.45" text-anchor="middle">Temporizador</text>
    </g>
    <g id="Tab Menu">
      <path d="M312 732h16M312 738h16M312 744h16" stroke="#2A2A3E" opacity="0.45" stroke-width="2" stroke-linecap="round"/>
      <text x="320" y="768" font-size="10" fill="#2A2A3E" opacity="0.45" text-anchor="middle">Menú</text>
    </g>
    <rect id="Gesture Bar" x="130" y="788" width="100" height="4" rx="2" fill="#2A2A3E" opacity="0.3"/>
  </g>
</svg>
